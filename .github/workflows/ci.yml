name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Lido pelo `dart pub token add --env-var` em cada `pub get`.
  PUB_TOKEN: ${{ secrets.PUB_TOKEN }}

jobs:
  check:
    name: Analyze & test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kuhnroyal/flutter-fvm-config-action/setup@v3
      - name: Authenticate private pub
        run: dart pub token add https://pub.rodolfodebonis.com.br --env-var PUB_TOKEN
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze
      - name: Test (app)
        run: flutter test --coverage --timeout 60s

      # Plugin nativo: analisa e testa isoladamente (contrato Dart do plugin).
      - name: Pub get (plugin)
        working-directory: packages/rbnotes_native
        run: flutter pub get
      - name: Analyze (plugin)
        working-directory: packages/rbnotes_native
        run: flutter analyze
      - name: Test (plugin)
        working-directory: packages/rbnotes_native
        run: flutter test --timeout 60s

  build:
    name: Build macOS
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kuhnroyal/flutter-fvm-config-action/setup@v3
      - name: Authenticate private pub
        run: dart pub token add https://pub.rodolfodebonis.com.br --env-var PUB_TOKEN
      # whisper.cpp é compilado do fonte pelo Podfile (scripts/build_whisper.sh).
      - name: Install cmake (whisper.cpp)
        run: brew install cmake
      - run: flutter pub get
      # Compila o whisper.xcframework ANTES do pod install (o hook do Podfile vira no-op) e deixa a
      # saída visível no log; o flutter build esconde a saída do pod install.
      - name: Build whisper.cpp xcframework
        run: |
          xcodebuild -version
          bash packages/rbnotes_native/scripts/build_whisper.sh
          find packages/rbnotes_native/macos/Frameworks -maxdepth 3 | sort
          lipo -info packages/rbnotes_native/macos/Frameworks/whisper.xcframework/*/whisper.framework/whisper
      - name: Build macOS (debug)
        run: flutter build macos --debug -t lib/main_production.dart
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      - name: Build macOS (release)
        run: flutter build macos --release -t lib/main_production.dart
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
