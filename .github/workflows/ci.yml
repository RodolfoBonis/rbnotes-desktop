name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Lido pelo `dart pub token add --env-var` em cada `pub get`.
  PUB_TOKEN: ${{ secrets.PUB_TOKEN }}

jobs:
  check:
    name: Analyze & test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # fvm instala o Flutter EXATAMENTE no commit fixado em `.fvmrc`
      # (um master pinado — ver README "Flutter toolchain"), igual ao local.
      - name: Install fvm
        run: |
          curl -fsSL https://fvm.app/install.sh | bash
          # O instalador não altera o PATH dos próximos steps.
          echo "$HOME/fvm/bin" >> "$GITHUB_PATH"
      - name: Install pinned Flutter (from .fvmrc)
        run: fvm install
      # A API de windowing (multi-janela nativa) só existe no master e atrás
      # desta flag; a flag é injetada em TODO build via dart-define, inclusive
      # release. SPM desligado porque o plugin nativo exige CocoaPods.
      - name: Configure Flutter features
        run: fvm flutter config --enable-windowing --no-enable-swift-package-manager
      - name: Authenticate private pub
        run: fvm dart pub token add https://pub.rodolfodebonis.com.br --env-var PUB_TOKEN
      - run: fvm flutter pub get
      - run: fvm dart format --set-exit-if-changed lib test integration_test
      - run: fvm flutter analyze
      - name: Test (app)
        run: fvm flutter test --coverage --timeout 60s

      # Plugin nativo: analisa e testa isoladamente (contrato Dart do plugin).
      - name: Pub get (plugin)
        working-directory: packages/rbnotes_native
        run: fvm flutter pub get
      - name: Analyze (plugin)
        working-directory: packages/rbnotes_native
        run: fvm flutter analyze
      - name: Test (plugin)
        working-directory: packages/rbnotes_native
        run: fvm flutter test --timeout 60s

  build:
    name: Build macOS
    needs: check
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install fvm
        run: |
          curl -fsSL https://fvm.app/install.sh | bash
          # O instalador não altera o PATH dos próximos steps.
          echo "$HOME/fvm/bin" >> "$GITHUB_PATH"
      - name: Install pinned Flutter (from .fvmrc)
        run: fvm install
      - name: Authenticate private pub
        run: fvm dart pub token add https://pub.rodolfodebonis.com.br --env-var PUB_TOKEN
      # whisper.cpp é compilado do fonte pelo Podfile (scripts/build_whisper.sh).
      - name: Install cmake (whisper.cpp)
        run: brew install cmake
      # O rbnotes_native (whisper.xcframework vendorizado) só é suportado via CocoaPods; com o Swift
      # Package Manager ligado (default do Flutter no runner) o grafo de build fica misto e o Swift do
      # plugin compila sem achar o módulo `whisper`. Habilita windowing (release) e usa CocoaPods.
      - name: Configure Flutter features
        run: fvm flutter config --enable-windowing --no-enable-swift-package-manager
      - run: fvm flutter pub get
      # Compila o whisper.xcframework ANTES do pod install (o hook do Podfile vira no-op) e deixa a
      # saída visível no log; o flutter build esconde a saída do pod install.
      - name: Build whisper.cpp xcframework
        run: |
          xcodebuild -version
          bash packages/rbnotes_native/scripts/build_whisper.sh
          find packages/rbnotes_native/macos/Frameworks -maxdepth 3 | sort
          lipo -info packages/rbnotes_native/macos/Frameworks/whisper.xcframework/*/whisper.framework/whisper
      - name: Build macOS (debug)
        run: fvm flutter build macos --debug -t lib/main_production.dart
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      - name: Build macOS (release)
        run: |
          args=()
          # Tag v1.2.3 → versão 1.2.3 no Info.plist (build number = run).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=(--build-name "${GITHUB_REF_NAME#v}" --build-number "$GITHUB_RUN_NUMBER")
          fi
          fvm flutter build macos --release -t lib/main_production.dart "${args[@]}"
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      # Release: só em tag v*. Empacota o .app (ad-hoc, sem notarização) em
      # .dmg + .zip e publica nas Releases do GitHub.
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          app=build/macos/Build/Products/Release/RbNotes.app
          codesign --verify --deep --strict "$app"
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/dmg
          ditto "$app" dist/dmg/RbNotes.app
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "RbNotes $version" -srcfolder dist/dmg \
            -ov -format UDZO "dist/RbNotes-$version.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/RbNotes-$version.zip"
          (cd dist && shasum -a 256 RbNotes-*.dmg RbNotes-*.zip > SHA256SUMS.txt)
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > dist/notes.md <<'MD'
          ## Instalação
          1. Baixe o `.dmg`, abra e arraste o **RbNotes** para **Aplicativos**.
          2. O app não é notarizado pela Apple. Na primeira abertura, rode no Terminal:
             `xattr -dr com.apple.quarantine /Applications/RbNotes.app`
             (ou clique com o botão direito → **Abrir** → **Abrir**).
          3. Conceda Microfone, Gravação de Tela e Acessibilidade quando o macOS pedir.
          MD
          gh release create "$GITHUB_REF_NAME" dist/RbNotes-*.dmg dist/RbNotes-*.zip dist/SHA256SUMS.txt \
            --title "RbNotes $GITHUB_REF_NAME" --notes-file dist/notes.md --generate-notes --verify-tag
