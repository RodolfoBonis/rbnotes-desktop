name: rbnotes
description: RbNotes — voice notes pessoais para macOS (local-first).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  bloc: ^9.2.0
  drift: ^2.21.0
  equatable: ^2.0.7
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^18.0.1
  flutter_localizations:
    sdk: flutter
  forma_ui:
    hosted: https://pub.rodolfodebonis.com.br
    version: ^2.2.0
  get_it: ^8.0.3
  go_router: ^17.0.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  just_audio: ^0.10.0
  local_auth: ^2.3.0
  lottie: ^3.1.3
  path: ^1.9.0
  path_provider: ^2.1.5
  rbnotes_native:
    path: packages/rbnotes_native
  sentry_flutter: ^9.0.0
  shared_preferences: ^2.5.3
  sqlite3_flutter_libs: ^0.5.26
  tray_manager: ^0.5.0
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  window_manager: ^0.5.0

dev_dependencies:
  bloc_lint: ^0.4.1
  bloc_test: ^10.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.21.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/app_icon_1024.png
    - assets/lottie/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
        - asset: assets/fonts/InterVariable-Italic.ttf
          style: italic
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-VariableFont.ttf
        - asset: assets/fonts/Newsreader-Italic-VariableFont.ttf
          style: italic
