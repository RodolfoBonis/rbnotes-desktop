name: rbnotes_native
description: >-
  Native macOS plugin for RbNotes: permissions, dual-source audio recording,
  local whisper.cpp (Metal) transcription and global dictation.
version: 0.0.1
publish_to: none
homepage: https://github.com/rodolfodebonis/rbnotes-desktop

environment:
  sdk: ^3.13.5
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: RbnotesNativePlugin
